<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atronic Project Tracker</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#24425E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2F6; --panel:#FFFFFF; --ink:#1C2536; --muted:#5D6B7E; --line:#D6DCE4; --soft:#F5F7FA;
  --accent:#24425E; --accent-ink:#FFFFFF; --navy:#24425E; --red:#F0423B; --red-ink:#D7322B; --ok:#2F8F5B; --warn:#B87F00; --bad:#C23B30; --track:#E3E8EF;
  --shadow:0 1px 0 rgba(28,37,54,.06);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#10151C; --panel:#18202A; --ink:#E3E8EF; --muted:#94A2B4; --line:#2A3542; --soft:#1D2631;
  --accent:#8FB3D9; --accent-ink:#0E1620; --navy:#24425E; --red:#F0524B; --red-ink:#FF7A72; --ok:#4FBF84; --warn:#E0AE3A; --bad:#EB6B5F; --track:#26313E; --shadow:none;
}}
:root[data-theme="dark"]{
  --bg:#10151C; --panel:#18202A; --ink:#E3E8EF; --muted:#94A2B4; --line:#2A3542; --soft:#1D2631;
  --accent:#8FB3D9; --accent-ink:#0E1620; --navy:#24425E; --red:#F0524B; --red-ink:#FF7A72; --ok:#4FBF84; --warn:#E0AE3A; --bad:#EB6B5F; --track:#26313E; --shadow:none;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
img{max-width:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:14px 20px 10px;flex-wrap:wrap}
.top::before,.authbox::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:linear-gradient(105deg,var(--navy) 0 64%,transparent 64% 65.2%,var(--red) 65.2%)}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.logo{display:block;height:34px;width:auto}
.logo-chip{display:inline-flex;border-radius:6px}
.bdiv{width:1px;align-self:stretch;background:var(--line);margin:2px 2px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo-chip{background:#fff;padding:3px 8px}}
:root[data-theme="dark"] .logo-chip{background:#fff;padding:3px 8px}
.b1{font-weight:800;letter-spacing:.02em;font-size:15px;color:var(--accent);text-transform:uppercase}
.b2{color:var(--muted);font-size:12px}
.psel select{min-width:220px;max-width:60vw;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--soft);font-weight:600}
.who{display:flex;align-items:center;gap:8px}
.who img{width:28px;height:28px;border-radius:50%}
.wn{font-weight:600;font-size:13px;line-height:1.1}
.role{font-size:12px;font-weight:600}
.r-admin{color:var(--accent)} .r-site{color:var(--ok)} .r-viewer{color:var(--muted)}

nav.tabs{display:flex;gap:2px;padding:0 20px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{border:0;background:none;padding:11px 14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-current="page"]{color:var(--accent);border-bottom-color:var(--red)}
.badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;line-height:18px;text-align:center}

main{max-width:1400px;margin:0 auto;padding:22px 20px 60px}
h1{font-size:28px;line-height:1.15;margin:0;letter-spacing:-.02em;font-weight:800}
h2{font-size:17px;margin:0 0 12px;font-weight:700}
.muted{color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px;box-shadow:var(--shadow)}
.grid{display:grid;gap:16px}
.btn{border:1px solid var(--line);background:var(--panel);padding:7px 12px;border-radius:6px;font-weight:600;cursor:pointer}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* overview */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;align-items:end}
.meta{color:var(--muted);margin-top:6px}
.gauges{display:flex;gap:28px;justify-content:flex-end}
.gauge .v{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1}
.gauge .l{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:4px}
.key{width:10px;height:10px;border-radius:2px;display:inline-block}
.k-d{background:var(--accent)} .k-i{background:var(--ok)}
.twin{position:relative;height:12px;background:var(--track);border-radius:3px;overflow:hidden;min-width:80px}
.twin i{position:absolute;left:0;top:0;height:6px;width:var(--d);background:var(--accent)}
.twin b{position:absolute;left:0;bottom:0;height:6px;width:var(--i);background:var(--ok)}
.twin.big{height:18px;margin-top:18px}.twin.big i,.twin.big b{height:9px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.kpi{background:var(--panel);padding:14px 16px}
.kpi .v{font-size:22px;font-weight:700}
.kpi .l{font-size:12.5px;color:var(--muted)}
.kpi.alert .v{color:var(--bad)}
.secgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px}
table{border-collapse:collapse;width:100%}
.stbl td,.stbl th{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.stbl th{font-size:12px;color:var(--muted);font-weight:600}
.stbl tr:last-child td{border-bottom:0}
.chip{display:inline-flex;align-items:center;gap:7px;font-weight:600}
.chip::before{content:"";width:9px;height:9px;border-radius:2px;background:var(--c)}
.num{text-align:right;white-space:nowrap}
.att{list-style:none;margin:0;padding:0}
.att li{padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
.att li:last-child{border-bottom:0}
.att .t{font-weight:600;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.att .w{font-size:12.5px;color:var(--bad)}

/* tracker */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input[type=search],.toolbar select{padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.toolbar input[type=search]{min-width:240px;flex:1}
.tbl-wrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px}
.ttbl{min-width:1050px}
.ttbl th{position:sticky;top:0;background:var(--soft);font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.ttbl td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.ttbl tr.it{cursor:pointer}
.ttbl tr.it:hover td{background:var(--soft)}
.ttbl tr.hd td{color:var(--muted);font-style:italic}
.ttbl tr.grp td{background:var(--panel);border-bottom:2px solid var(--c);padding-top:16px;font-weight:700}
.grp .gs{font-weight:500;color:var(--muted);margin-left:12px;font-size:12.5px}
.desc{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:420px}
.mk{font-size:12px;color:var(--muted);margin-top:2px}
.neg{color:var(--bad);font-weight:600}
.st{display:inline-block;padding:2px 8px;border-radius:4px;font-size:12px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.st.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.st.info{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.st.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.st.bad{background:color-mix(in srgb,var(--bad) 13%,transparent);color:var(--bad)}
.st.plain{border-color:var(--line);color:var(--muted)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-left:5px;vertical-align:middle}
.dot.f{background:var(--bad)} .dot.r{background:var(--warn)}

/* drawer & modal */
.scrim{position:fixed;inset:0;background:rgba(10,15,22,.45);z-index:40;display:none}
.scrim.open{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--panel);z-index:41;border-left:1px solid var(--line);transform:translateX(100%);transition:transform .2s ease;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.open{transform:none}
.dh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.dh h2{margin:0;font-size:16px}
.db{padding:18px 20px;overflow-y:auto;flex:1}
.df{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:600}
.form .wide{grid-column:1/-1}
.form input,.form select,.form textarea{padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);font-weight:400;font-size:14px}
.form textarea{min-height:70px;resize:vertical}
.form .ro{padding:7px 0;color:var(--ink);font-weight:400;font-size:14px;white-space:pre-wrap;word-break:break-word}
.form .locked input{background:var(--soft)}
.sub{margin-top:22px;padding-top:14px;border-top:1px solid var(--line)}
.sub h3{font-size:13.5px;margin:0 0 8px}
.xbtn{margin-left:auto;border:0;background:none;font-size:22px;line-height:1;cursor:pointer;color:var(--muted);padding:2px 6px}
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.open{display:flex}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:min(560px,100%);max-height:90vh;overflow:auto;padding:20px}
.mbox h2{margin-bottom:6px}
.pbar{height:8px;background:var(--track);border-radius:4px;overflow:hidden;margin-top:14px}
.pbar i{display:block;height:100%;background:var(--accent);width:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;z-index:60;display:none;max-width:90vw}
.toast.show{display:block}

/* requests & activity */
.req{border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--panel)}
.req+.req{margin-top:10px}
.req .h{display:flex;gap:10px;flex-wrap:wrap;align-items:baseline}
.req .it{font-weight:600}
.chg{margin:10px 0;font-size:13.5px}
.chg td{padding:3px 12px 3px 0}
.chg .from{color:var(--muted);text-decoration:line-through}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:6px 12px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--soft);color:var(--ink)}
.log li{list-style:none;padding:10px 0;border-bottom:1px solid var(--line)}
.log{margin:0;padding:0}
.log .when{font-size:12px;color:var(--muted)}
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:10px}
.pcard h3{margin:0;font-size:16px}
.pcard.cur{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.stat-line{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.roles .panel h3{margin:0 0 4px}
.roles ul{margin:8px 0 0;padding-left:18px}
.empty{text-align:center;padding:60px 20px}
.empty h1{font-size:24px;margin-bottom:8px}

@media (max-width:860px){
  .hero,.secgrid{grid-template-columns:1fr}
  .gauges{justify-content:flex-start}
  .form{grid-template-columns:1fr}
  main{padding:16px 12px 48px}
  .top{padding:10px 12px}
  nav.tabs{padding:0 8px}
  .psel select{min-width:0;width:100%}
  .psel{order:3;width:100%}
}
@media (prefers-reduced-motion:reduce){.drawer{transition:none}}
/* v2 additions */
.sumstrip{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:18px}
.sumstrip div{background:var(--panel);padding:10px 12px}
.sumstrip .v{font-weight:700;font-size:17px}
.sumstrip .l{font-size:12px;color:var(--muted)}
.sech{display:flex;align-items:baseline;gap:10px;margin:22px 0 10px;padding-top:14px;border-top:1px solid var(--line)}
.sech h3{margin:0;font-size:14.5px}
.lvl{font-size:12px;font-weight:600;padding:1px 7px;border-radius:4px}
.lvl.edit{color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent)}
.lvl.request{color:var(--warn);background:color-mix(in srgb,var(--warn) 15%,transparent)}
.lvl.none{color:var(--muted);background:var(--soft)}
.lots{font-size:13px}
.lots td,.lots th{padding:6px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.lots th{font-size:12px;color:var(--muted);font-weight:600}
.lots tr.off td{color:var(--muted);text-decoration:line-through}
.lotadd{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-top:10px;align-items:end;background:var(--soft);padding:10px;border-radius:6px}
.lotadd label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);font-weight:600}
.lotadd input,.lotadd select{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);font-size:13.5px}
.lnk{border:0;background:none;color:var(--accent);cursor:pointer;padding:0;font-weight:600;font-size:12.5px}
.lnk.bad{color:var(--bad)}
.perm{min-width:760px}
.perm td,.perm th{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left}
.perm th{font-size:12px;color:var(--muted);font-weight:600;background:var(--soft)}
.perm select{padding:5px 6px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.perm tr.def td{background:var(--soft)}
.pres{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.pres button{display:flex;align-items:center;gap:6px}
.pres img{width:20px;height:20px;border-radius:50%}
.ovt{min-width:760px}
.ovt th,.ovt td{padding:12px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.ovt th{background:var(--soft);font-size:12.5px;color:var(--muted);font-weight:600;white-space:nowrap}
.ovt tfoot td{background:var(--soft);border-bottom:0}
.ovt tr.hd td{opacity:.6}
.mc{display:flex;align-items:center;gap:10px}
.mc span{font-weight:700;min-width:42px;text-align:right}
.mb{flex:1;height:8px;background:var(--track);border-radius:4px;overflow:hidden;min-width:60px}
.mb i{display:block;height:100%}
.pbar2{margin:-4px 0 16px;display:flex;flex-direction:column;gap:12px}
.crumb{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.crumb .lnk{font-size:14px}
.crumb select{padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);font-weight:700;font-size:16px;max-width:70vw}
.ptabs{align-self:flex-start;max-width:100%;overflow-x:auto}
.ptabs button{padding:8px 16px;white-space:nowrap}
.lvl.hide{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.npc{display:grid;gap:10px}
.npo{display:flex;flex-direction:column;gap:4px;text-align:left;border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--panel);color:var(--ink);font:inherit}
button.npo{cursor:pointer}button.npo:hover{border-color:var(--accent);background:var(--soft)}
.npo span{color:var(--muted);font-size:13px}.npo.dis{opacity:.7}
.pgh{grid-column:1/-1;font-size:15px;margin:6px 0 0;color:var(--muted)}
.pcard.done{opacity:.85}
#cfm{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;background:rgba(10,15,22,.45);padding:16px}
#cfm.open{display:flex}
.cfm-box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;width:min(440px,100%);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.cfm-box p{margin:0;font-size:14.5px;line-height:1.5}

/* auth */
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.authbox{position:relative;overflow:hidden;width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:30px 28px 26px;box-shadow:0 10px 30px rgba(36,66,94,.10)}
.authbox::before{height:6px}
.auth{flex-direction:column;gap:14px;background:radial-gradient(1200px 500px at 50% -10%,rgba(36,66,94,.10),transparent 60%),var(--bg)}
.authlogo{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:4px}
.authlogo .logo-chip{width:min(250px,85%);justify-content:center}
.authlogo img{width:100%;height:auto;display:block}
.authlogo .t{font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:12.5px;color:var(--accent)}
.authfoot{font-size:12px;color:var(--muted);text-align:center}
.authfoot a{color:inherit}
.authbox h1{font-size:22px;margin:14px 0 4px}
.authbox .form{grid-template-columns:1fr}
.authbox .btn{width:100%;padding:10px}
.authlinks{display:flex;justify-content:space-between;margin-top:14px;font-size:13px}
.err{color:var(--bad);font-size:13px;margin-top:8px}
.umenu{position:relative}
.umenu button.who{border:0;background:none;cursor:pointer;padding:4px;border-radius:6px}
.umenu button.who:hover{background:var(--soft)}
.udrop{position:absolute;right:0;top:44px;background:var(--panel);border:1px solid var(--line);border-radius:8px;min-width:200px;padding:6px;display:none;z-index:25;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.udrop.open{display:block}
.udrop button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:6px;cursor:pointer}
.udrop button:hover{background:var(--soft)}
.ini{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.refresh{border:0;background:none;color:var(--muted);cursor:pointer;font-size:12.5px}
</style>
</head>
<body>
<div id="app"><div class="empty"><span class="spin"></span></div></div>
<div class="scrim" id="scrim" data-act="closeDrawer"></div>
<aside class="drawer" id="drawer" aria-hidden="true" role="dialog" aria-label="Item details"></aside>
<div class="modal" id="modal" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
